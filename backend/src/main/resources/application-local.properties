# Start a local defense/demo with SPRING_PROFILES_ACTIVE=local.
# This fallback is local-only. Outside local development, set a unique
# JWT_SECRET of at least 32 UTF-8 bytes and configure CORS_ALLOWED_ORIGINS.
incident-ops.security.jwt-secret=${JWT_SECRET:incident-ops-local-demo-signing-secret-change-before-shared-use}
incident-ops.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
