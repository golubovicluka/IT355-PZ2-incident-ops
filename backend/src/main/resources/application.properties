spring.application.name=incident-ops

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incident_ops}
spring.datasource.username=${DB_USERNAME:luka}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

incident-ops.security.jwt-secret=${JWT_SECRET:}
incident-ops.security.token-lifetime=${JWT_TOKEN_LIFETIME:PT15M}
incident-ops.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}

spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-stacktrace=never
